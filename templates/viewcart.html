{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cart</title>
<!-- Font Awesome for trash icon -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
body{
    font-family:Poppins, sans-serif;
    padding:40px;
    background:#f9f9f9;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.cart-item{
    display:flex;
    align-items:center;
    gap:20px;
    border-bottom:1px solid #ddd;
    padding:15px 0;
    background:#fff;
}

.cart-item img{
    width:80px;
    padding: 1%;
}

.cart-item h3{
    flex:1;
    margin:0;
}

.cart-item p{
    font-size:18px;
    margin:0;
}

.qty{
    display:flex;
    align-items:center;
    gap:10px;
}

.qty button{
    padding:5px 12px;
    font-size:18px;
    cursor:pointer;
}

.total{
    text-align:right;
    font-size:22px;
    margin-top:20px;
    font-weight:bold;
}

.delete-btn{
    width:42px;
    height:42px;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:red;
    color:white;
    border:none;
    border-radius:50%;
    cursor:pointer;
}

.delete-btn:hover{
    background:darkred;
}

.empty-cart{
    text-align:center;
    font-size:18px;
    color:#555;
    margin-top:20px;
}
/* ===== RESPONSIVE CART ===== */

@media (max-width: 768px) {

    body{
        padding:20px;
    }

    .cart-item{
        flex-direction: column;
        align-items: flex-start;
        gap:10px;
        padding:15px;
    }

    .cart-item img{
        width:100%;
        max-width:120px;
        align-self:center;
    }

    .cart-item h3{
        font-size:18px;
        width:100%;
        text-align:center;
    }

    .qty{
        width:100%;
        justify-content:center;
    }

    .cart-item p{
        width:100%;
        text-align:center;
        font-size:18px;
        font-weight:600;
    }

    .delete-btn{
        align-self:flex-end;
    }

    .total{
        text-align:center;
        font-size:20px;
    }

    a button{
        width:100%;
    }
}

</style>
</head>

<body>

<h1>🛒 My Cart</h1>

<div id="cart"></div>
<div class="total" id="total"></div>
<a href="{% url 'place_order' %}">
    <button style="margin-top:20px; padding:10px 20px; font-size:16px; cursor:pointer;background-color: gold;">Proceed to Checkout</button>
</a>
<script>
    // Initialize cart from localStorage, empty by default
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    const cartDiv = document.getElementById("cart");
    const totalDiv = document.getElementById("total");

    // Function to render cart
    function renderCart(){
        cartDiv.innerHTML = "";
        let total = 0;

        if(cart.length === 0){
            cartDiv.innerHTML = "<p class='empty-cart'>Your cart is empty</p>";
            totalDiv.innerHTML = "";
            return;
        }

        cart.forEach((item, index) => {
            total += item.price * item.qty;

            cartDiv.innerHTML += `
                <div class="cart-item">
                    <img src="${item.image}" alt="${item.title}">
                    <h3>${item.title}</h3>

                    <div class="qty">
                        <button onclick="changeQty(${index}, -1)">−</button>
                        <span>${item.qty}</span>
                        <button onclick="changeQty(${index}, 1)">+</button>
                    </div>

                    <p>₹${item.price * item.qty}</p>

                    <button class="delete-btn" onclick="removeItem(${index})"><i class="fa-solid fa-trash"></i></button>
                </div>
            `;
        });

        totalDiv.innerText = "Total: ₹" + total;

        // Save cart to localStorage
        localStorage.setItem("cart", JSON.stringify(cart));
    }

    // Change quantity
    function changeQty(index, change){
        if(cart[index].qty + change <= 0){
            removeItem(index);
        } else {
            cart[index].qty += change;
            renderCart();
        }
    }

    // Remove item from cart
    function removeItem(index){
        cart.splice(index, 1);
        renderCart();
    }

    // Initial render
    renderCart();
</script>

</body>
</html>
